neuron:
  # Morris-Lecar standard parameters (Type I neuron)
  # Units: V, A/m², S/m², F/m²
  Cm: 20.0e-6      # membrane capacitance (F/cm²)
  Gna: 4.4e-3      # max calcium conductance (S/cm²)
  Gk: 8.0e-3       # max potassium conductance (S/cm²)
  GL: 2.0e-3       # leak conductance (S/cm²)
  ECa: 0.120       # calcium Nernst potential (V)
  EK: -0.084       # potassium Nernst potential (V)
  EL: -0.060       # leak Nernst potential (V)
  V1: -0.0012      # ML fitting parameter (V)
  V2: 0.018        # ML fitting parameter (V)
  V3: 0.002        # ML fitting parameter (V)
  V4: 0.030        # ML fitting parameter (V)
  lambda0: 40.0    # reference frequency (Hz)

encoding:
  T: 10
  Iex_min: 75.0e-6    
  Iex_max: 150.0e-6
  tau_syn: 50.0e-3 

ris:
  N: 32
  n_bits: 2
  K: 1

channel:
  K_rician: 3
  sigma2: 1.0

simulation:
  seed: 42
  dt: 1.0e-4       # pas de temps (s) — plus grand car unités différentes
  T_sim: 0.5       # durée simulation (s)