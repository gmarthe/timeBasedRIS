[project]
name = "timebasedris"
version = "0.1.0"
description = "Time-based SNN for RIS passive beamforming"
authors = [
    { name = "gmarthe", email = "guillaume.marthe@wanadoo.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "hatchling>=1.32.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
